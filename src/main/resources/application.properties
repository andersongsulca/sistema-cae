# ==========================================
# CONFIGURACION GENERAL
# ==========================================
spring.application.name=SistemaAcademico
server.port=8080

# ==========================================
# CONFIGURACION DE BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/SistemaCae
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACION DE THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ==========================================
# SEGURIDAD DE SESION
# ==========================================
# Tiempo de inactividad antes de cerrar la sesion (1 minuto para demostracion)
server.servlet.session.timeout=1m

# Nombre personalizado para la cookie de sesion
server.servlet.session.cookie.name=CAE_SESSION_ID

# En localhost (desarrollo) debe ser FALSE. En produccion con HTTPS cambiar a TRUE.
server.servlet.session.cookie.secure=false

# Evita que JavaScript pueda leer la cookie (protege contra robo por XSS)
server.servlet.session.cookie.http-only=true

# Previene que la cookie se envie en solicitudes entre sitios (Cross-Site Request Forgery)
server.servlet.session.cookie.same-site=lax/n/nserver.port=//nspring.datasource.url=//nspring.datasource.username=//nspring.datasource.password=//nserver.servlet.session.cookie.secure=//n