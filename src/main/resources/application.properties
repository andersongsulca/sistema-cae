# ==========================================
# CONFIGURACION GENERAL
# ==========================================
spring.application.name=SistemaAcademico
server.port=${PORT:8080}

# ==========================================
# CONFIGURACION DE BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/SistemaCae}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACION DE THYMELEAF
# ==========================================
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ==========================================
# SEGURIDAD DE SESION
# ==========================================
server.servlet.session.timeout=1m
server.servlet.session.cookie.name=CAE_SESSION_ID
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
