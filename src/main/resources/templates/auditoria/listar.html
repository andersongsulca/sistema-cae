auditoria listar:<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Registro de Auditoría - Sistema CAE</title>
</head>
<body>
    <div layout:fragment="content">
        <h2><i class="bi bi-shield-check me-2"></i>Registro de Auditoría</h2>
        
        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(registros)}" class="text-center py-5">
                    <i class="bi bi-shield-slash text-muted" style="font-size: 4rem;"></i>
                    <h5 class="text-muted mt-3">No hay registros de auditoría</h5>
                    <p class="text-muted">Aún no se han registrado actividades en el sistema.</p>
                </div>
                
                <div th:unless="${#lists.isEmpty(registros)}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Tabla</th>
                                <th>IP</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="registro : ${registros}">
                                <td th:text="${registro.id}">1</td>
                                <td th:text="${#temporals.format(registro.fecha, 'dd/MM/yyyy HH:mm:ss')}">
                                    01/01/2024 10:00:00
                                </td>
                                <td>
                                    <i class="bi bi-person-circle me-1"></i>
                                    <span th:text="${registro.usuario}">usuario</span>
                                </td>
                                <td>
                                    <span class="badge bg-info" th:text="${registro.accion}">Acción</span>
                                </td>
                                <td th:text="${registro.tabla}">tabla</td>
                                <td>
                                    <code th:text="${registro.ip}">127.0.0.1</code>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
