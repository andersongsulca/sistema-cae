<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Reporte Movimientos - Sistema CAE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div layout:fragment="content">
        <h2>Reporte de Movimientos</h2>
        <form action="/reportes/movimientos" method="get" class="row mb-3">
            <div class="col"><input type="date" name="inicio" class="form-control" required></div>
            <div class="col"><input type="date" name="fin" class="form-control" required></div>
            <div class="col"><button class="btn btn-primary">Filtrar</button></div>
        </form>
        <table class="table" th:if="${movimientos != null}">
            <thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th></tr></thead>
            <tbody>
                <tr th:each="m : ${movimientos}">
                    <td th:text="${m.fechaMovimiento}"></td>
                    <td th:text="${m.tipo}"></td>
                    <td th:text="${m.cantidad}"></td>
                </tr>
            </tbody>
        </table>
        <a href="/reportes" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
