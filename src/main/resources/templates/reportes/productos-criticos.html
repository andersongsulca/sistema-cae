<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Productos Críticos - Sistema CAE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div layout:fragment="content">
        <h2 class="text-danger">Productos con Stock Crítico</h2>
        <table class="table table-danger">
            <thead><tr><th>Código</th><th>Nombre</th><th>Stock Actual</th><th>Mínimo</th></tr></thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.stockActual}"></td>
                    <td th:text="${p.stockMinimo}"></td>
                </tr>
            </tbody>
        </table>
        <a href="/reportes" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
