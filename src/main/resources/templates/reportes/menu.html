<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Reportes - Sistema CAE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4"><i class="bi bi-file-earmark-text"></i> Generación de Reportes</h2>
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card text-center p-3">
                    <a href="/reportes/inventario" class="btn btn-primary btn-lg">Reporte de Inventario</a>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center p-3">
                    <a href="/reportes/movimientos" class="btn btn-success btn-lg">Reporte de Movimientos</a>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center p-3">
                    <a href="/reportes/productos-criticos" class="btn btn-danger btn-lg">Productos Críticos</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
