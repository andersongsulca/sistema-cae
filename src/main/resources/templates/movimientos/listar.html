<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Movimientos - Sistema CAE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/home">
                <span class="brand-badge"><i class="bi bi-basket3-fill"></i></span>
                Sistema CAE
            </a>
            <div class="navbar-nav ms-auto align-items-center flex-row gap-3">
                <span class="user-chip">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name">Usuario</span>
                    <span class="badge-rol" sec:authentication="principal.authorities">Rol</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-salir">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <h6>Menú Principal</h6>

                <a href="/home">
                    <i class="bi bi-house-door"></i>
                    <span>Inicio</span>
                </a>

                <!-- DIRECTORA -->
                <div sec:authorize="hasAuthority('ROLE_DIRECTORA')">
                    <hr>
                    <h6>Directora</h6>

                    <a href="/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>

                    <a href="/inventario">
                        <i class="bi bi-archive"></i>
                        <span>Inventario</span>
                    </a>

                    <a href="/reportes">
                        <i class="bi bi-file-earmark-text"></i>
                        <span>Reportes</span>
                    </a>

                    <a href="/usuarios">
                        <i class="bi bi-people"></i>
                        <span>Usuarios</span>
                    </a>

                    <a href="/auditoria">
                        <i class="bi bi-shield-check"></i>
                        <span>Auditoría</span>
                    </a>

                    <a href="/respaldos">
                        <i class="bi bi-cloud-download"></i>
                        <span>Respaldos</span>
                    </a>
                </div>

                <!-- SECRETARIA -->
                <div sec:authorize="hasAuthority('ROLE_SECRETARIA')">
                    <hr>
                    <h6>Secretaria</h6>

                    <a href="/productos">
                        <i class="bi bi-box-seam"></i>
                        <span>Productos</span>
                    </a>

                    <a href="/proveedores">
                        <i class="bi bi-building"></i>
                        <span>Proveedores</span>
                    </a>

                    <a href="/recepciones">
                        <i class="bi bi-inbox"></i>
                        <span>Recepciones</span>
                    </a>

                    <a href="/inventario">
                        <i class="bi bi-archive"></i>
                        <span>Inventario</span>
                    </a>

                    <a href="/solicitudes">
                        <i class="bi bi-card-checklist"></i>
                        <span>Solicitudes</span>
                    </a>

                    <a href="/salidas">
                        <i class="bi bi-box-arrow-up"></i>
                        <span>Salidas</span>
                    </a>

                    <a href="/alertas">
                        <i class="bi bi-bell"></i>
                        <span>Alertas</span>
                    </a>

                    <a href="/movimientos">
                        <i class="bi bi-arrow-left-right"></i>
                        <span>Movimientos</span>
                    </a>
                </div>

                <!-- COCINERA -->
                <div sec:authorize="hasAuthority('ROLE_COCINERA')">
                    <hr>
                    <h6>Cocinera</h6>

                    <a href="/menu">
                        <i class="bi bi-calendar-week"></i>
                        <span>Menú Semanal</span>
                    </a>

                    <a href="/solicitudes/nueva">
                        <i class="bi bi-file-earmark-plus"></i>
                        <span>Solicitar Insumos</span>
                    </a>

                    <a href="/solicitudes/mis-solicitudes">
                        <i class="bi bi-eye"></i>
                        <span>Mis Solicitudes</span>
                    </a>

                    <a href="/inventario">
                        <i class="bi bi-search"></i>
                        <span>Consultar</span>
                    </a>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto content">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div layout:fragment="content"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Resalta el enlace del sidebar correspondiente a la página actual
        document.addEventListener('DOMContentLoaded', function () {
            var path = window.location.pathname;
            document.querySelectorAll('.sidebar a').forEach(function (link) {
                var href = link.getAttribute('href');
                if (href && href !== '/' && path.indexOf(href) === 0) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
